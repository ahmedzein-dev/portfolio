<!-- 🔥 Remove old service worker + cached files -->
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) {
          reg.unregister();
        }
      });

      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
</script>
